<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eid Ul Azha Mubarak</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        overflow:hidden;
    }

    .container{
        text-align:center;
        color:white;
        padding:40px;
        border-radius:20px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        box-shadow:0 0 20px rgba(255,255,255,0.2);
        width:90%;
        max-width:600px;
    }

    .top-name{
        font-size:42px;
        font-weight:bold;
        color:#FFD700;
        text-shadow:0 0 10px #FFD700;
        margin-bottom:20px;
        letter-spacing:2px;
    }

    h1{
        font-size:38px;
        color:#fff;
        margin-bottom:15px;
    }

    p{
        font-size:20px;
        color:#ddd;
    }

    .moon{
        position:absolute;
        top:50px;
        right:70px;
        width:100px;
        height:100px;
        background:#FFD700;
        border-radius:50%;
        box-shadow:0 0 40px #FFD700;
    }

    .moon::after{
        content:'';
        position:absolute;
        width:85px;
        height:85px;
        background:#203a43;
        border-radius:50%;
        top:0;
        left:20px;
    }
</style>
</head>

<body>

<div class="moon"></div>

<div class="container">
    <div class="top-name">✨ Aizaz Ali Shah ✨</div>

    <h1>Eid Ul Azha Mubarak</h1>
    <p>Wishing happiness, peace and blessings to everyone 🌙✨</p>
</div>

<script>
    let userName = prompt("Please enter your name:");

    if(userName && userName.trim() !== ""){
        alert("Eid Ul Azha Mubarak to everyone, " + userName + " 🌙✨");
    } else {
        alert("Eid Ul Azha Mubarak to everyone 🌙✨");
    }
</script>

</body>
</html>
